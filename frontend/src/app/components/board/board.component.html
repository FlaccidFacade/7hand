<section class="board" aria-label="The table">
  <div
    class="space"
    *ngFor="let space of spaces; trackBy: trackSpace"
    [class.mine]="space.isMe"
    [attr.data-player-id]="space.playerId"
  >
    <header class="space-header">
      <span class="space-name">{{ space.name }}</span>
      <span class="badge" *ngIf="space.qualified">Qualified</span>
      <span class="qualification-label">{{ space.handLabel || 'Choosing a hand' }}</span>
    </header>
    
    
      <div class="circles"  class="available-hands">
  @for (entry of space.availableHandLabels! | keyvalue; track entry.key) {
    <span class="circle" [class.filled]="entry.value">{{ entry.key }}</span>
  }
</div>
 
    <div class="melds">
      <button
        type="button"
        class="meld"
        *ngFor="let meld of space.melds; trackBy: trackMeld"
        [class.targetable]="targetable"
        [attr.data-meld-id]="meld.id"
        [attr.aria-disabled]="!targetable"
        [attr.aria-label]="meldLabel(meld)"
        (click)="onMeldClick(space, meld)"
      >
        <span class="meld-label">{{ meldLabel(meld) }}</span>
        <span class="meld-cards">
          <span
            class="meld-card"
            *ngFor="let card of meld.cards; let i = index"
            [class.red]="isRed(card)"
            [class.joker]="isJoker(card)"
            [attr.title]="cardTitle(meld, i)"
          >{{ cardText(card) }}</span>
        </span>
      </button>
      <p class="empty" *ngIf="space.melds.length === 0">Nothing played yet</p>
    </div>
  </div>
</section>
